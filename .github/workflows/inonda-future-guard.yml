name: INONDA architectural release checks
on:
  pull_request:
    branches: [main]
  workflow_dispatch:
jobs:
  preserve-content:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Preserve original content, metadata, branding and calculator sources
        run: |
          python3 - <<'PY'
          from pathlib import Path
          import re, subprocess
          changed = subprocess.check_output(['git', 'diff', '--name-only', 'origin/main...HEAD'], text=True).splitlines()
          allowed = {'.github/workflows/inonda-future-guard.yml', 'docs/INONDA_ARCHITECTURAL_RELEASE.md', 'tools/inonda_future.py', 'tools/future-design.css', 'tools/future-ui.js', 'public/assets/future-design.css', 'public/assets/future-ui.js', 'dist/future-design.css', 'dist/future-ui.js'}
          # Explicitly reviewed carpentry feature surface; unchanged pricing and metadata are still protected.
          allowed.update({'dist/carpentry.mjs','dist/carpentry-ui.mjs','dist/app.js','dist/styles.css','tests/carpentry.test.mjs','tests/carpentry.browser.mjs','README.md','.github/workflows/carpentry-validation.yml'})
          # Owner-approved price update (November 2026, PR #6): reviewed estimator prices, labels, messages and wording.
          allowed.update({'AGENTS.md','EDITING.md','dist/estimator.mjs','dist/i18n.mjs','dist/assistant.mjs','dist/inonda-chat.js','dist/inonda-network.js','tools/inonda_chat.js','tools/network-copy.json','tests/estimator.test.mjs','tests/assistant.test.mjs','tests/i18n.test.mjs'})
          APPROVED_INDEX_EDITS = [
              ("We assess, quote and take on only jobs of more than one day of work. Small repairs, urgent repairs and jobs of a few minutes or hours are carried out only for customers with a maintenance contract. Quotations under a maintenance contract are completely free.",
               "For jobs estimated at up to €1,000, the on-site quotation visit is free within 10 km of our office in Strovolos and costs €50 beyond 10 km. In Limassol, Larnaca, Agia Napa and Paphos, quotation visits for jobs up to €1,000 are charged; for work over €1,000, the quotation is included in the work. We take on jobs of every size, including small jobs of a few hours. Quotations under a maintenance contract are completely free."),
              ('HE490415', 'HE 490415'),
              ('<div><span>Property services across Cyprus</span>', '<div><span class="footer-slogan"><strong>Quality above all</strong></span><span>Property services across Cyprus</span>'),
          ]
          def previous(path):
              return subprocess.check_output(['git', 'show', 'origin/main:' + path], text=True)
          def normalize(text):
              text = re.sub(r'<!-- INONDA FUTURE ASSETS START -->.*?<!-- INONDA FUTURE ASSETS END -->', '', text, flags=re.S)
              return re.sub(r'(\.(?:css|js|svg)\?v=)[^"\'<> ]+', r'\1VERSION', text)
          for path in changed:
              new = Path(path).read_text()
              if path.endswith('.html'):
                  old_html = normalize(previous(path))
                  new_html = normalize(new)
                  if path == 'dist/index.html':
                      anchor = '<div id="bp-jobs"></div>'
                      added = '\n        <section id="bp-carpentry-section" class="bp-carpentry" aria-label="Carpentry & Custom Woodwork"></section>'
                      approved = old_html
                      for before, after in APPROVED_INDEX_EDITS:
                          approved = approved.replace(before, after)
                      assert new_html in (approved, old_html.replace(anchor,anchor+added)), 'Unexpected estimator HTML change'
                  else:
                      assert old_html == new_html, 'Original HTML changed: ' + path
              elif path == 'tools/inonda_network.py':
                  old = previous(path).replace("VERSION = '20261030-1'", "VERSION = '20261030-2'")
                  old = old.replace('from inonda_seo import enhance_seo', 'from inonda_seo import enhance_seo\nfrom inonda_future import enhance_future')
                  old = old.replace('    return text\n\n\nCSS =', '    return enhance_future(text, site)\n\n\nCSS =')
                  assert new == old, 'Unexpected shared generator change'
              elif path in ['server.py', 'host/server.py']:
                  old = previous(path)
                  anchor = "          '/estimator.mjs': ('estimator.mjs', 'text/javascript; charset=utf-8'),"
                  routes = "\n          '/carpentry.mjs': ('carpentry.mjs', 'text/javascript; charset=utf-8'),\n          '/carpentry-ui.mjs': ('carpentry-ui.mjs', 'text/javascript; charset=utf-8'),"
                  assert old.replace(anchor,anchor+routes) == new, 'Unexpected host behavior change'
              else:
                  assert path in allowed, 'Unexpected changed file: ' + path
          print('Original content, metadata, logo files and calculation code preserved')
          PY
      - name: Validate complete design assets and reproducible source
        run: |
          python3 - <<'PY'
          from pathlib import Path
          import re
          assets = Path('dist') if Path('dist/index.html').exists() else Path('public/assets')
          for name in ['future-design.css', 'future-ui.js']:
              assert (assets/name).read_bytes() == (Path('tools')/name).read_bytes(), 'Design source mismatch'
          css = (assets/'future-design.css').read_text()
          assert 'INONDA FUTURE' in css and 'prefers-reduced-motion' in css and '@media print' in css
          stripped = re.sub(r'/\*.*?\*/', '', css, flags=re.S)
          assert stripped.count('{') == stripped.count('}'), 'Unbalanced CSS'
          import sys
          sys.path.insert(0,'tools')
          from inonda_future import enhance_future
          sample = '<head><title>Preserved</title></head><body><header></header><main>Original content</main></body>'
          site = 'homes' if assets == Path('dist') else 'site'
          enhanced = enhance_future(sample,site)
          assert enhance_future(enhanced,site) == enhanced, 'Enhancement must be idempotent'
          assert enhanced.split('</head>',1)[1] == sample.split('</head>',1)[1], 'Original body changed'
          PY
          node --check tools/future-ui.js
      - name: Verify estimator access, languages and calculations when present
        run: |
          if [ -f server.py ]; then
            cmp server.py host/server.py
            node --test tests/*.test.mjs
            python3 -m unittest discover -s tests -p 'test_*.py'
          fi
